language: node_js
node_js:
  - "22.23.5"
  - "24.22.3"
  - "26.13.1"
install:
  - "npm install -g bower"
  - "npm install -g testem"
  - "npm install -g grunt-cli"
  - "npm install -g chest"
before_script:
  - chest boost
  - npm install
  - bower install
  - grunt test
script:
  - testem launchers
  - testem ci
